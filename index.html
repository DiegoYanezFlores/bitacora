<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora</title>
<meta name="theme-color" content="#0E1317">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --paper: #0E1317;
    --card: #172028;
    --card-2: #202A34;
    --ink: #F3F6F8;
    --soft: #94A2AF;
    --line: #2A3541;
    --done: #B8F53B;
    --done-ink: #10170A;
    --fire: #FF7A1A;
    --fire-2: #FF3D7F;
    --xp: #9B8CFF;
    --sky: #38C9FF;
    --sun: #FFD23F;
    --flag: #FF6B5B;
    --r: 14px;
    --r-sm: 9px;
    --font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    background:
      radial-gradient(900px 420px at 110% -8%, rgba(155, 140, 255, .20), transparent 60%),
      radial-gradient(700px 360px at -15% 2%, rgba(255, 122, 26, .13), transparent 55%),
      var(--paper);
    background-repeat: no-repeat;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .num, .big, .hist, input[type=number] { font-variant-numeric: tabular-nums; }
  .soft { color: var(--soft); }
  .small { font-size: 13px; }

  .wrap { max-width: 600px; margin: 0 auto; padding: 8px 16px 56px; }

  /* Encabezado: saludo, nivel y siguiente paso */
  header.top { padding: 12px 0 6px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { font-weight: 700; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
  h1 { font-size: 30px; font-weight: 700; margin: 12px 0 0; letter-spacing: -.02em; line-height: 1.15; }
  .sub { color: var(--soft); font-size: 13px; margin-top: 2px; }
  .level { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
  .lvl-badge { flex: none; width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #0E1317; background: linear-gradient(135deg, var(--xp), var(--sky)); box-shadow: 0 8px 24px rgba(155, 140, 255, .35); }
  .lvl-main { flex: 1; min-width: 0; }
  .lvl-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--soft); }
  .lvl-top b { color: var(--xp); font-weight: 600; }
  .xpbar { height: 10px; background: var(--card-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .xpbar span { display: block; height: 100%; background: linear-gradient(90deg, var(--xp), var(--sky)); border-radius: 99px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
  .nudge { margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); }
  .nudge > div { flex: 1; min-width: 0; }
  .nudge b { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .nudge span { display: block; font-size: 13px; color: var(--soft); margin-top: 2px; }
  .nudge.win { border-color: rgba(184, 245, 59, .45); background: linear-gradient(135deg, rgba(184, 245, 59, .10), rgba(56, 201, 255, .06)), var(--card); }

  section.block { padding: 22px 0 4px; }
  .block-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--soft); margin: 0; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
  .big { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }

  .btn { min-height: 44px; border: 0; background: var(--done); color: var(--done-ink); border-radius: var(--r-sm); padding: 10px 16px; font-weight: 700; font-size: 15px; white-space: nowrap; box-shadow: 0 6px 18px rgba(184, 245, 59, .22); transition: transform .12s; }
  .btn:active { transform: scale(.95); }
  .btn.ghost { background: var(--card-2); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  .btn.danger { background: transparent; color: var(--flag); border: 1px solid var(--flag); box-shadow: none; }
  .btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .btn.is-done { background: rgba(255, 255, 255, .2); color: #fff; box-shadow: none; }
  .link { background: none; border: 0; padding: 0; color: var(--soft); text-decoration: underline; font-size: 13px; }

  /* 1. Inglés */
  .streak { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; }
  .streak.lit { background: linear-gradient(135deg, var(--fire), var(--fire-2)); border-color: transparent; color: #fff; box-shadow: 0 14px 36px rgba(255, 61, 127, .28); }
  .streak-main { display: flex; align-items: center; gap: 12px; }
  .streak-main .big { font-size: 48px; }
  .streak-main small { display: block; font-size: 13px; color: var(--soft); margin-top: 4px; }
  .streak.lit .streak-main small { color: rgba(255, 255, 255, .88); }
  .flame { font-size: calc(30px + var(--f, 0) * 1px); line-height: 1; filter: grayscale(1) opacity(.45); }
  .streak.lit .flame { filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .25)); }
  .milestone { margin-top: 10px; font-size: 13px; color: var(--sun); font-weight: 500; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 12px; }
  .cal .dow { font-size: 11px; color: var(--soft); text-align: center; }
  .cal .c { height: 18px; border-radius: 5px; border: 0; padding: 0; background: var(--card-2); }
  .cal .c.on { background: linear-gradient(135deg, var(--fire), var(--fire-2)); }
  .cal .c.pre, .cal .c.future { background: transparent; border: 1px dashed var(--line); }
  .cal .c.today { outline: 2px solid var(--ink); outline-offset: 1px; }
  .cal button.c { cursor: pointer; }
  .cal-foot { margin-top: 8px; }

  /* 2. Tareas */
  .notice { border-left: 3px solid var(--sun); padding: 10px 12px; background: rgba(255, 210, 63, .08); color: var(--sun); font-size: 13px; margin-bottom: 10px; border-radius: var(--r-sm); }
  .wk-stat { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); }
  .ring { width: 30px; height: 30px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring-bg { stroke: var(--card-2); }
  .ring-fg { stroke: var(--done); stroke-linecap: round; transition: stroke-dasharray .6s cubic-bezier(.2, .8, .2, 1); }
  ul.list, ol.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.list li, ol.list li { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 6px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
  .tick { flex: none; width: 30px; height: 30px; margin: 7px; border: 2px solid var(--soft); border-radius: 9px; background: transparent; display: grid; place-items: center; position: relative; }
  .tick::after { content: ""; position: absolute; inset: -7px; }
  .tick svg { width: 17px; height: 17px; visibility: hidden; }
  .tick.on { background: var(--done); border-color: var(--done); color: var(--done-ink); }
  .tick.on svg { visibility: visible; }
  .item { flex: 1; min-width: 0; background: none; border: 0; padding: 10px 0; text-align: left; overflow-wrap: anywhere; }
  .item .t { display: block; font-weight: 500; }
  .item .w { display: block; font-size: 13px; color: var(--soft); margin-top: 2px; font-weight: 400; }
  li.is-done { opacity: .62; }
  li.is-done .item .t { text-decoration: line-through; }
  .prio { flex: none; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; }
  .prio.p1 { color: var(--fire-2); background: rgba(255, 61, 127, .14); }
  .prio.p2 { color: var(--sun); background: rgba(255, 210, 63, .12); }
  .prio.p3 { color: var(--sky); background: rgba(56, 201, 255, .12); }
  .row-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .row-actions .spacer { flex: 1; }
  .empty-line { color: var(--soft); font-size: 14px; padding: 10px 0; margin: 0; }

  /* 3. Contadores */
  .counters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .counter .label, .capital .label { font-size: 13px; color: var(--soft); display: block; margin-bottom: 6px; }
  .counter.apps .big { color: var(--sky); }
  .counter.interviews .big { color: var(--xp); }
  .stepper { display: flex; gap: 8px; margin-top: 12px; }
  .stepper button { flex: 1; min-height: 42px; border: 1px solid var(--line); background: var(--card-2); border-radius: var(--r-sm); font-size: 20px; font-weight: 600; transition: transform .12s; }
  .stepper button[data-act="inc"] { background: var(--done); color: var(--done-ink); border-color: transparent; }
  .stepper button:active { transform: scale(.94); }
  .capital { grid-column: 1 / -1; display: block; width: 100%; text-align: left; }
  .capital .figs { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .bar { display: block; height: 10px; background: var(--card-2); border-radius: 99px; overflow: hidden; margin-top: 12px; }
  .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--done), var(--sky)); border-radius: 99px; }

  /* 4. Pendientes de terceros */
  .since { flex: none; font-size: 13px; color: var(--soft); }
  .since.late { color: var(--sun); font-weight: 600; }
  .x { flex: none; background: none; border: 0; color: var(--soft); font-size: 22px; line-height: 1; width: 36px; height: 36px; }
  form.inline { display: flex; gap: 8px; margin-top: 10px; }
  form.inline input { flex: 1; min-width: 0; }

  /* 5. Historial */
  .hist { display: flex; gap: 5px; align-items: flex-end; }
  .hcol { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .hbar { width: 100%; max-width: 28px; height: 90px; background: var(--card-2); border-radius: 7px; display: flex; align-items: flex-end; overflow: hidden; }
  .hbar span { display: block; width: 100%; background: linear-gradient(to top, var(--done), var(--sky)); border-radius: 7px; }
  .hbar span.low { background: linear-gradient(to top, var(--fire), var(--sun)); }
  .hpct { font-size: 11px; font-weight: 600; }
  .hwk { font-size: 10px; color: var(--soft); }
  .encourage { color: var(--sun); font-size: 13px; margin: 12px 0 0; }

  /* 6. Hoja de ruta */
  .item .m { display: block; font-size: 12px; font-weight: 700; color: var(--xp); text-transform: uppercase; letter-spacing: .06em; }

  textarea, input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select {
    width: 100%; background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 12px; font-size: 16px; color: var(--ink);
  }
  textarea { min-height: 110px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: #6E7C89; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--xp); outline-offset: -1px; }

  footer.tools { display: flex; flex-wrap: wrap; gap: 16px; padding-top: 22px; }

  dialog { border: 1px solid var(--line); border-radius: var(--r); padding: 0; width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); background: var(--card); color: var(--ink); box-shadow: 0 24px 64px rgba(0, 0, 0, .55); }
  dialog::backdrop { background: rgba(5, 8, 10, .7); }
  .dlg { padding: 18px; }
  .dlg h2 { font-size: 19px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0 0 14px; font-weight: 700; }
  .field { margin-bottom: 12px; }
  .field label, .field .label { display: block; font-size: 13px; color: var(--soft); margin-bottom: 5px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .actions .spacer { flex: 1; }
  .hint { font-size: 13px; color: var(--soft); margin: 0; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; max-width: calc(100vw - 32px); pointer-events: none; z-index: 80; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }

  /* Recompensas */
  .confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; }
  .xp-float { position: fixed; z-index: 70; pointer-events: none; font-weight: 700; font-size: 18px; color: var(--done); text-shadow: 0 2px 14px rgba(184, 245, 59, .6); transform: translate(-50%, -50%); animation: xpUp 1.1s ease-out forwards; }
  .banner { position: fixed; left: 50%; top: 32%; z-index: 75; pointer-events: none; min-width: 240px; max-width: calc(100vw - 32px); padding: 20px 28px; border-radius: 20px; text-align: center; color: #fff; background: linear-gradient(135deg, var(--xp), var(--fire-2)); box-shadow: 0 24px 64px rgba(0, 0, 0, .55); transform: translate(-50%, -50%); animation: bannerIn 2.6s cubic-bezier(.2, 1.4, .4, 1) forwards; }
  .banner b { display: block; font-size: 30px; line-height: 1.1; }
  .banner span { display: block; font-size: 14px; margin-top: 6px; opacity: .92; }
  .pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes xpUp {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); }
    15% { opacity: 1; transform: translate(-50%, -80%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -260%) scale(1); }
  }
  @keyframes bannerIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
    14% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    24% { transform: translate(-50%, -50%) scale(1); }
    85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -62%) scale(.98); }
  }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand-row"><span class="brand">Bitácora</span><div id="sync"></div></div>
    <h1 id="greet">Hola</h1>
    <div class="sub num" id="weekInfo"></div>
    <div class="level" id="level"></div>
    <div id="nudge"></div>
  </header>

  <section class="block" id="english"></section>
  <section class="block" id="tasks"></section>
  <section class="block" id="counters"></section>
  <section class="block" id="waiting"></section>
  <section class="block" id="history"></section>
  <section class="block" id="roadmap"></section>
  <section class="block">
    <div class="block-head"><h2>Notas</h2></div>
    <textarea id="notes" aria-label="Notas"></textarea>
  </section>

  <footer class="tools">
    <button class="link" data-act="export">Exportar copia (JSON)</button>
    <button class="link" data-act="import">Importar copia</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </footer>
</div>

<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'bitacora-v1';
  const $ = (s, r = document) => r.querySelector(s);

  // ---------- utilidades ----------
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const pad = n => String(n).padStart(2, '0');
  const dayKey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseDay = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parseDay(k); d.setDate(d.getDate() + n); return dayKey(d); };
  const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 86400000);
  const weekStart = k => { const d = parseDay(k); return addDays(k, -((d.getDay() + 6) % 7)); }; // lunes
  const fmtDay = k => parseDay(k).toLocaleDateString('es', { day: 'numeric', month: 'short' });
  const fmtShort = k => { const d = parseDay(k); return d.getDate() + '/' + (d.getMonth() + 1); };
  const money = n => Number(n).toLocaleString('es-EC', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
  }

  // ---------- estado ----------
  // { started, week, tasks:[{id,t,w,p,d}], english:{'YYYY-MM-DD':1}, apps, interviews, capital, capital0,
  //   waiting:[{id,t,since}], hist:[{week,done,total}], notes, roadmap:[{id,m,t,d}], updatedAt, deleted:{id:iso} }
  // `updatedAt` y `deleted` (marcas de borrado) los usa la sincronización entre dispositivos.
  const SEED_ROADMAP = [
    { id: 'rm1', m: 'Meses 1–3', t: 'Base: inglés todos los días. CV y LinkedIn en inglés con el stack actual (ELK, NestJS, Angular, PostgreSQL, Docker, AWS).', d: false },
    { id: 'rm2', m: 'Meses 4–6', t: 'Salir al mercado: aplicaciones cada semana y primeras entrevistas.', d: false },
    { id: 'rm3', m: 'Meses 7–9', t: 'Convertir: entrevistas técnicas en inglés; ajustar CV y enfoque con el feedback.', d: false },
    { id: 'rm4', m: 'Meses 10–12', t: 'Cerrar: oferta aceptada y capital bajando según lo previsto.', d: false }
  ];

  function fresh() {
    const today = dayKey();
    return {
      started: today, week: weekStart(today), tasks: [], english: {}, apps: 0, interviews: 0,
      capital: null, capital0: null, waiting: [], hist: [], notes: '',
      roadmap: SEED_ROADMAP.map(x => ({ ...x })), updatedAt: null, deleted: {}
    };
  }

  const numOrNull = v => (v === null || v === undefined || v === '' || !isFinite(+v) ? null : +v);
  const isDay = k => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k);

  function normalize(s) {
    if (!s || typeof s !== 'object') return null;
    const base = fresh();
    if (!Array.isArray(s.tasks)) {
      // Documento del tracker genérico anterior: se conserva intacto en `legacy`.
      if (!Array.isArray(s.goals)) return null;
      return { ...base, legacy: s.goals, updatedAt: s.updatedAt || null };
    }
    const obj = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
    return {
      ...s,
      started: isDay(s.started) ? s.started : base.started,
      week: isDay(s.week) ? weekStart(s.week) : base.week,
      tasks: s.tasks.filter(Boolean).map(x => ({ id: x.id || uid(), t: String(x.t || ''), w: String(x.w || ''), p: [1, 2, 3].includes(+x.p) ? +x.p : 2, d: !!x.d })),
      english: obj(s.english),
      apps: Math.max(0, +s.apps || 0),
      interviews: Math.max(0, +s.interviews || 0),
      capital: numOrNull(s.capital),
      capital0: numOrNull(s.capital0),
      waiting: (Array.isArray(s.waiting) ? s.waiting : []).filter(Boolean).map(x => ({ id: x.id || uid(), t: String(x.t || ''), since: isDay(x.since) ? x.since : dayKey() })),
      hist: (Array.isArray(s.hist) ? s.hist : []).filter(h => h && isDay(h.week)).map(h => ({ week: h.week, done: +h.done || 0, total: +h.total || 0 })),
      notes: String(s.notes || ''),
      roadmap: Array.isArray(s.roadmap) ? s.roadmap.filter(Boolean).map(x => ({ id: x.id || uid(), m: String(x.m || ''), t: String(x.t || ''), d: !!x.d })) : base.roadmap,
      updatedAt: s.updatedAt || null,
      deleted: obj(s.deleted)
    };
  }

  function load() {
    try { return normalize(JSON.parse(localStorage.getItem(STORAGE_KEY))) || fresh(); }
    catch (e) { return fresh(); }
  }

  let state = load();

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { toast('No se pudo guardar en este dispositivo'); }
  }

  function save() {
    state.updatedAt = new Date().toISOString();
    persist();
    render();
    reward();
    document.dispatchEvent(new CustomEvent('bitacora:change', { detail: { updatedAt: state.updatedAt } }));
  }

  const tombstone = id => { state.deleted[id] = new Date().toISOString(); };

  // Fusión de dos copias (local y nube). Campos simples: gana la copia más reciente.
  // Listas con id: unión menos borrados. Inglés: unión de días. Historial: unión por semana.
  function merge(a, b) {
    a = normalize(a) || fresh();
    b = normalize(b) || fresh();
    const [newer, older] = (Date.parse(a.updatedAt) || 0) >= (Date.parse(b.updatedAt) || 0) ? [a, b] : [b, a];
    const deleted = { ...older.deleted, ...newer.deleted };
    const byId = (n, o) => {
      const seen = new Set(n.map(x => x.id));
      return n.concat(o.filter(x => !seen.has(x.id))).filter(x => !deleted[x.id]);
    };
    const english = { ...newer.english };
    for (const k of Object.keys(older.english)) if (!newer.deleted['en:' + k]) english[k] = 1;
    const hist = new Map();
    for (const h of older.hist.concat(newer.hist)) hist.set(h.week, h);
    return {
      ...older,
      ...newer,
      started: older.started < newer.started ? older.started : newer.started,
      week: older.week > newer.week ? older.week : newer.week,
      tasks: byId(newer.tasks, older.tasks),
      waiting: byId(newer.waiting, older.waiting),
      roadmap: byId(newer.roadmap, older.roadmap),
      english,
      hist: [...hist.values()].sort((x, y) => x.week.localeCompare(y.week)),
      deleted,
      updatedAt: new Date().toISOString()
    };
  }

  // API mínima para sync.js.
  window.Bitacora = {
    getState: () => JSON.parse(JSON.stringify(state)),
    replaceState(next) {
      next = normalize(JSON.parse(JSON.stringify(next)));
      if (!next) return false;
      state = next;
      persist();
      render();
      resetRewardBaseline();
      return true;
    },
    hasData: () => Boolean(state.updatedAt),
    merge,
    toast
  };

  // ---------- XP y niveles (se calculan del estado; no se guardan) ----------
  const XP = { english: 10, task: 20, app: 15, interview: 50, stage: 150 };
  const MILESTONES = [3, 7, 14, 21, 30, 50, 75, 100, 150, 200, 365];
  const LEVEL_NAMES = [[1, 'Arrancando'], [3, 'Constante'], [5, 'Imparable'], [8, 'Élite'], [12, 'Leyenda']];
  const weekBonus = h => (!h.done ? 0 : h.done / h.total >= 0.8 ? 100 : h.done / h.total >= 0.5 ? 50 : 10);

  function xpOf(s) {
    let xp = 0, run = 0, prev = null;
    for (const k of Object.keys(s.english).filter(k => s.english[k]).sort()) {
      run = prev && daysBetween(prev, k) === 1 ? run + 1 : 1;
      xp += XP.english + Math.min(run, 10) * 2; // la racha multiplica
      prev = k;
    }
    xp += s.tasks.filter(t => t.d).length * XP.task;
    for (const h of s.hist) xp += h.done * XP.task + weekBonus(h);
    xp += s.apps * XP.app + s.interviews * XP.interview;
    xp += s.roadmap.filter(r => r.d).length * XP.stage;
    if (s.capital != null && s.capital0 > 0) xp += Math.max(0, Math.floor(((s.capital0 - s.capital) / s.capital0) * 100)) * 5;
    return xp;
  }

  const levelStart = n => 50 * n * (n - 1); // 0, 100, 300, 600, 1000…
  function levelOf(xp) {
    let n = 1;
    while (xp >= levelStart(n + 1)) n++;
    return { n, from: levelStart(n), to: levelStart(n + 1) };
  }
  const levelName = n => LEVEL_NAMES.filter(([min]) => n >= min).pop()[1];
  const currentStreak = () => { const t = dayKey(); return streak(state.english[t] ? t : addDays(t, -1)); };

  // ---------- recompensas inmediatas ----------
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let lastPoint = null;
  let lastActId = null;
  let lastXp = xpOf(state);
  let lastStreak = currentStreak();
  document.addEventListener('pointerdown', e => { lastPoint = { x: e.clientX, y: e.clientY }; }, true);

  const buzz = pattern => { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* no soportado */ } };

  function floatXp(n) {
    const el = document.createElement('div');
    const p = lastPoint || { x: innerWidth / 2, y: innerHeight / 2 };
    el.className = 'xp-float';
    el.textContent = `+${n} XP`;
    el.style.left = Math.min(Math.max(p.x, 50), innerWidth - 50) + 'px';
    el.style.top = p.y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1150);
  }

  function banner(title, sub) {
    const el = document.createElement('div');
    el.className = 'banner';
    el.innerHTML = `<b>${esc(title)}</b><span>${esc(sub)}</span>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2700);
  }

  function confetti(big) {
    if (reduceMotion.matches) return;
    const c = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1;
    c.className = 'confetti';
    c.width = innerWidth * dpr;
    c.height = innerHeight * dpr;
    document.body.appendChild(c);
    const ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    const o = big || !lastPoint ? { x: innerWidth / 2, y: innerHeight * 0.35 } : lastPoint;
    const colors = ['#B8F53B', '#FF7A1A', '#FF3D7F', '#9B8CFF', '#38C9FF', '#FFD23F'];
    const parts = Array.from({ length: big ? 150 : 40 }, () => {
      const a = Math.random() * Math.PI * 2;
      const v = (big ? 6 : 3) + Math.random() * (big ? 8 : 4);
      return { x: o.x, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (big ? 5 : 3), s: 5 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: colors[(Math.random() * colors.length) | 0] };
    });
    const start = performance.now();
    const dur = big ? 1900 : 950;
    (function frame(t) {
      const k = (t - start) / dur;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const p of parts) {
        p.vy += 0.28; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - k);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      }
      if (k < 1) requestAnimationFrame(frame); else c.remove();
    })(start);
  }

  // Compara con el estado anterior y celebra lo ganado. No se dispara con datos que llegan de la nube.
  function reward() {
    const xp = xpOf(state);
    const s = currentStreak();
    const gained = xp - lastXp;
    const lvUp = levelOf(xp).n > levelOf(lastXp).n;
    if (gained > 0) {
      floatXp(gained);
      buzz(15);
      if (lastActId) document.querySelectorAll(`[data-id="${lastActId}"] .tick.on`).forEach(el => el.classList.add('pop'));
      if (s > lastStreak) $('#english .streak').classList.add('pop');
    }
    if (s > lastStreak && MILESTONES.includes(s)) {
      confetti(true); buzz([30, 60, 30]);
      banner(`🔥 ${s} días seguidos`, 'Racha desbloqueada. No la sueltes.');
    } else if (lvUp) {
      confetti(true); buzz([30, 60, 30]);
      banner(`Nivel ${levelOf(xp).n}`, levelName(levelOf(xp).n));
    } else if (gained > 0) {
      confetti(false);
    }
    lastXp = xp;
    lastStreak = s;
    lastActId = null;
  }

  function resetRewardBaseline() { lastXp = xpOf(state); lastStreak = currentStreak(); }

  // ---------- encabezado: saludo, nivel y siguiente paso ----------
  function nudgeHtml() {
    const today = dayKey();
    const s = currentStreak();
    if (!state.english[today]) {
      return `<div class="nudge"><div><b>${s ? `Tu racha de ${s} ${s === 1 ? 'día' : 'días'} te espera` : 'Enciende tu racha hoy'}</b><span>Un toque y sumas XP.</span></div>
        <button class="btn" data-act="en-toggle" data-day="${today}">Inglés hecho</button></div>`;
    }
    if (weekStart(today) > state.week) {
      return `<div class="nudge"><div><b>Cierra la semana</b><span>Cobra tu bonus y empieza limpio.</span></div>
        <button class="btn" data-act="close-week">Cerrar</button></div>`;
    }
    const next = state.tasks.filter(t => !t.d).sort((a, b) => a.p - b.p)[0];
    if (next) {
      return `<div class="nudge" data-id="${next.id}"><div><b>${esc(next.t)}</b><span>Tu siguiente paso · +${XP.task} XP</span></div>
        <button class="btn" data-act="task-toggle">Hecha</button></div>`;
    }
    return `<div class="nudge win"><div><b>Día ganado ✨</b><span>¿Una aplicación más? +${XP.app} XP</span></div>
      <button class="btn" data-act="inc" data-k="apps">+1 aplicación</button></div>`;
  }

  function renderHeader() {
    const h = new Date().getHours();
    const xp = xpOf(state);
    const lv = levelOf(xp);
    const pct = Math.round(((xp - lv.from) / (lv.to - lv.from)) * 100);
    $('#greet').textContent = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
    $('#level').innerHTML = `
      <span class="lvl-badge">Nv ${lv.n}</span>
      <div class="lvl-main">
        <div class="lvl-top"><b>${levelName(lv.n)}</b><span class="num">${xp - lv.from} / ${lv.to - lv.from} XP</span></div>
        <div class="xpbar"><span style="width:${pct}%"></span></div>
      </div>`;
    $('#nudge').innerHTML = nudgeHtml();
  }

  // ---------- 1. Racha de inglés ----------
  function streak(from) {
    let k = from, n = 0;
    while (state.english[k]) { n++; k = addDays(k, -1); }
    return n;
  }

  function bestStreak() {
    const days = Object.keys(state.english).filter(k => state.english[k]).sort();
    let best = 0, run = 0, prev = null;
    for (const k of days) {
      run = prev && daysBetween(prev, k) === 1 ? run + 1 : 1;
      best = Math.max(best, run);
      prev = k;
    }
    return best;
  }

  function renderEnglish() {
    const today = dayKey();
    const yesterday = addDays(today, -1);
    const doneToday = !!state.english[today];
    const current = streak(doneToday ? today : yesterday);
    const ws = weekStart(today);
    let thisWeek = 0;
    for (let i = 0; i < 7; i++) if (state.english[addDays(ws, i)]) thisWeek++;
    const total = Object.keys(state.english).filter(k => state.english[k]).length;

    const cells = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<span class="dow">${d}</span>`);
    const first = addDays(ws, -28);
    for (let i = 0; i < 35; i++) {
      const k = addDays(first, i);
      const on = !!state.english[k];
      const cls = ['c', on ? 'on' : '', k > today ? 'future' : '', k < state.started && !on ? 'pre' : '', k === today ? 'today' : ''].filter(Boolean).join(' ');
      // Solo hoy y ayer se pueden marcar/desmarcar (olvido de anoche); el resto es historial.
      cells.push(k === today || k === yesterday
        ? `<button class="${cls}" data-act="en-toggle" data-day="${k}" aria-pressed="${on}" aria-label="${fmtDay(k)}"></button>`
        : `<span class="${cls}" title="${fmtDay(k)}${on ? ' · hecho' : ''}"></span>`);
    }

    $('#english').innerHTML = `
      <div class="block-head"><h2>Racha de inglés</h2><span class="small soft num">Esta semana ${thisWeek}/7</span></div>
      <div class="card streak${doneToday ? ' lit' : ''}">
        <div class="streak-main"><span class="flame" style="--f:${Math.min(current, 30)}" aria-hidden="true">🔥</span><div><b class="big">${current}</b><small>${current === 1 ? 'día seguido' : 'días seguidos'}</small></div></div>
        <button class="btn${doneToday ? ' is-done' : ''}" data-act="en-toggle" data-day="${today}" aria-pressed="${doneToday}">${doneToday ? '¡Hecho hoy!' : 'Marcar hoy'}</button>
      </div>
      <div class="milestone">${(() => {
        const next = MILESTONES.find(m => m > current);
        if (!doneToday) return current ? `Márcalo hoy y llegas a ${current + 1} ${current + 1 === 1 ? 'día' : 'días'}` : 'Hoy es un buen día para empezar';
        return next ? `Próxima meta: ${next} días · faltan ${next - current}` : 'Racha legendaria';
      })()}</div>
      <div class="cal">${cells.join('')}</div>
      <div class="cal-foot small soft num">Mejor racha: ${bestStreak()} · Total: ${total} días</div>`;
  }

  // ---------- 2. Tareas de la semana ----------
  function renderTasks() {
    const today = dayKey();
    const done = state.tasks.filter(t => t.d).length;
    const total = state.tasks.length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const ended = weekStart(today) > state.week;
    const list = [...state.tasks].sort((a, b) => (a.d - b.d) || (a.p - b.p));

    $('#tasks').innerHTML = `
      <div class="block-head"><h2>Tareas · semana del ${fmtDay(state.week)}</h2><span class="wk-stat num"><svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.5" class="ring-bg"/><circle cx="18" cy="18" r="15.5" class="ring-fg" stroke-dasharray="${(pct * 0.974).toFixed(1)} 97.4"/></svg>${done}/${total} · ${pct}%</span></div>
      ${ended ? `<div class="notice">La semana del ${fmtDay(state.week)} ya terminó. Ciérrala para archivar su resultado.</div>` : ''}
      ${list.length ? `<ul class="list">${list.map(t => `
        <li class="${t.d ? 'is-done' : ''}" data-id="${t.id}">
          <button class="tick${t.d ? ' on' : ''}" data-act="task-toggle" aria-pressed="${t.d}" aria-label="Hecha">${checkSvg}</button>
          <button class="item" data-act="task-edit"><span class="t">${esc(t.t)}</span>${t.w ? `<span class="w">${esc(t.w)}</span>` : ''}</button>
          <span class="prio p${t.p}">P${t.p}</span>
        </li>`).join('')}</ul>` : '<p class="empty-line">Sin tareas esta semana.</p>'}
      <div class="row-actions">
        <button class="btn ghost" data-act="task-add">+ Tarea</button>
        <span class="spacer"></span>
        <button class="btn" data-act="close-week">Cerrar semana</button>
      </div>`;
  }

  function closeWeek() {
    const done = state.tasks.filter(t => t.d).length;
    const total = state.tasks.length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const pending = total - done;
    if (!confirm(`Cerrar la semana del ${fmtDay(state.week)}: ${done} de ${total} (${pct}%).\n${pending} ${pending === 1 ? 'tarea pasa' : 'tareas pasan'} a la siguiente semana.\nNo se puede deshacer.`)) return;

    state.hist.push({ week: state.week, done, total });
    state.tasks.filter(t => t.d).forEach(t => tombstone(t.id));
    state.tasks = state.tasks.filter(t => !t.d);
    // Semanas que pasaron sin cerrarse cuentan como 0 hechas sobre lo que seguía pendiente.
    const current = weekStart(dayKey());
    let next = addDays(state.week, 7);
    while (next < current) {
      state.hist.push({ week: next, done: 0, total: state.tasks.length });
      next = addDays(next, 7);
    }
    state.week = next;
    save();
    toast(pct >= 80 ? `¡Semanón! ${pct}% archivado 🏆` : pct >= 50 ? `Buena semana: ${pct}%. A por más.` : `${pct}% archivado. Semana nueva: arranca con algo pequeño.`);
  }

  // ---------- 3. Contadores ----------
  function renderCounters() {
    const hasCap = state.capital != null;
    const paid = hasCap && state.capital0 > 0 ? Math.max(0, Math.min(100, Math.round(((state.capital0 - state.capital) / state.capital0) * 100))) : null;
    const counter = (k, label) => `
      <div class="card counter ${k}">
        <span class="label">${label}</span>
        <b class="big">${state[k]}</b>
        <div class="stepper"><button data-act="dec" data-k="${k}" aria-label="Restar">−</button><button data-act="inc" data-k="${k}" aria-label="Sumar">+</button></div>
      </div>`;
    $('#counters').innerHTML = `
      <div class="block-head"><h2>Contadores</h2></div>
      <div class="counters">
        ${counter('apps', 'Aplicaciones')}
        ${counter('interviews', 'Entrevistas')}
        <button class="card capital" data-act="capital-edit">
          <span class="label">Capital (saldo de deuda)</span>
          ${hasCap ? `
            <span class="figs num"><b class="big">${money(state.capital)}</b>${state.capital0 != null ? `<span class="small soft">de ${money(state.capital0)}${paid != null ? ` · pagado ${paid}%` : ''}</span>` : ''}</span>
            ${paid != null ? `<span class="bar"><span style="width:${paid}%"></span></span>` : ''}`
          : '<span class="small soft">Toca para registrar el saldo inicial y actual.</span>'}
        </button>
      </div>`;
  }

  // ---------- 4. Pendientes de terceros ----------
  function renderWaiting() {
    const today = dayKey();
    const list = [...state.waiting].sort((a, b) => a.since.localeCompare(b.since));
    $('#waiting').innerHTML = `
      <div class="block-head"><h2>Pendientes de terceros</h2><span class="small soft num">${list.length}</span></div>
      ${list.length ? `<ul class="list">${list.map(x => {
        const days = daysBetween(x.since, today);
        return `<li data-id="${x.id}">
          <button class="item" data-act="wait-edit"><span class="t">${esc(x.t)}</span></button>
          <span class="since num${days > 14 ? ' late' : ''}">${days === 0 ? 'hoy' : days + ' d'}</span>
          <button class="x" data-act="wait-done" aria-label="Resuelto">×</button>
        </li>`;
      }).join('')}</ul>` : ''}
      <form class="inline" data-form="wait">
        <input type="text" name="t" maxlength="140" placeholder="Qué esperas y de quién" required autocomplete="off" aria-label="Nuevo pendiente">
        <button class="btn" type="submit">Añadir</button>
      </form>`;
  }

  // ---------- 5. Cumplimiento semanal ----------
  function renderHistory() {
    const hist = state.hist.slice(-16);
    const avg = hist.length ? Math.round(hist.reduce((a, h) => a + (h.total ? h.done / h.total : 0), 0) / hist.length * 100) : null;
    $('#history').innerHTML = `
      <div class="block-head"><h2>Cumplimiento semanal</h2>${avg != null ? `<span class="small soft num">Promedio ${avg}%</span>` : ''}</div>
      ${hist.length ? `<div class="hist">${hist.map(h => {
        const pct = h.total ? Math.round((h.done / h.total) * 100) : 0;
        return `<div class="hcol" title="Semana del ${fmtDay(h.week)}: ${h.done}/${h.total}">
          <div class="hbar"><span class="${pct < 50 ? 'low' : ''}" style="height:${pct}%"></span></div>
          <span class="hpct">${pct}%</span><span class="hwk">${fmtShort(h.week)}</span>
        </div>`;
      }).join('')}</div>` : '<p class="empty-line">Aún no has cerrado ninguna semana.</p>'}
      ${hist.length && hist[hist.length - 1].done / (hist[hist.length - 1].total || 1) < 0.5 ? '<p class="encourage">Semana difícil, y está bien. La que viene empieza de cero: una tarea pequeña basta para arrancar.</p>' : ''}`;
  }

  // ---------- 6. Hoja de ruta ----------
  function renderRoadmap() {
    $('#roadmap').innerHTML = `
      <div class="block-head"><h2>Hoja de ruta</h2><span class="small soft">12 meses · 1–3 h/semana</span></div>
      ${state.roadmap.length ? `<ol class="list">${state.roadmap.map(x => `
        <li class="${x.d ? 'is-done' : ''}" data-id="${x.id}">
          <button class="tick${x.d ? ' on' : ''}" data-act="rm-toggle" aria-pressed="${x.d}" aria-label="Cumplida">${checkSvg}</button>
          <button class="item" data-act="rm-edit">${x.m ? `<span class="m">${esc(x.m)}</span>` : ''}<span class="t">${esc(x.t)}</span></button>
        </li>`).join('')}</ol>` : ''}
      <div class="row-actions"><button class="btn ghost" data-act="rm-add">+ Etapa</button></div>`;
  }

  // ---------- render ----------
  function render() {
    const today = dayKey();
    const n = Math.floor(daysBetween(weekStart(state.started), weekStart(today)) / 7) + 1;
    $('#weekInfo').textContent = `Semana ${n} de 52 · desde ${fmtDay(state.started)}`;
    renderHeader();
    renderEnglish();
    renderTasks();
    renderCounters();
    renderWaiting();
    renderHistory();
    renderRoadmap();
    const notes = $('#notes');
    if (document.activeElement !== notes) notes.value = state.notes;
  }

  // ---------- diálogo genérico ----------
  const dlg = $('#dlg');
  const dlgForm = $('#dlgForm');
  let dlgHandlers = null;

  function openForm({ title, fields, onSubmit, onDelete, deleteLabel = 'Eliminar' }) {
    dlgHandlers = { onSubmit, onDelete };
    dlgForm.innerHTML = `
      <h2>${esc(title)}</h2>
      ${fields.map((f, i) => `
        <div class="field">
          <label for="fd-${i}">${esc(f.label)}</label>
          ${f.type === 'select'
            ? `<select id="fd-${i}" name="${f.name}">${f.options.map(o => `<option value="${o[0]}"${String(o[0]) === String(f.value) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`
            : f.type === 'textarea'
              ? `<textarea id="fd-${i}" name="${f.name}" ${f.required ? 'required' : ''}>${esc(f.value ?? '')}</textarea>`
              : `<input id="fd-${i}" name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" ${f.required ? 'required' : ''} ${f.type === 'number' ? 'step="any" inputmode="decimal"' : 'autocomplete="off"'} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>`}
        </div>`).join('')}
      <div class="actions">
        ${onDelete ? `<button type="button" class="btn danger small" data-dlg="delete">${esc(deleteLabel)}</button>` : ''}
        <span class="spacer"></span>
        <button type="button" class="btn ghost small" data-dlg="cancel">Cancelar</button>
        <button type="submit" class="btn small">Guardar</button>
      </div>`;
    dlg.showModal();
  }

  dlgForm.addEventListener('submit', e => {
    e.preventDefault();
    if (!dlgForm.reportValidity()) return;
    const values = Object.fromEntries(new FormData(dlgForm).entries());
    dlg.close();
    if (dlgHandlers && dlgHandlers.onSubmit) dlgHandlers.onSubmit(values);
  });

  dlgForm.addEventListener('click', e => {
    const b = e.target.closest('[data-dlg]');
    if (!b) return;
    dlg.close();
    if (b.dataset.dlg === 'delete' && dlgHandlers && dlgHandlers.onDelete) dlgHandlers.onDelete();
  });

  const prioOptions = [[1, 'P1 · alta'], [2, 'P2 · media'], [3, 'P3 · baja']];

  function taskForm(t) {
    openForm({
      title: t ? 'Editar tarea' : 'Nueva tarea',
      fields: [
        { name: 't', label: 'Tarea', value: t && t.t, required: true, placeholder: 'Qué vas a hacer' },
        { name: 'w', label: 'Por qué', value: t && t.w, placeholder: 'Para qué sirve en el plan' },
        { name: 'p', label: 'Prioridad', type: 'select', value: t ? t.p : 2, options: prioOptions }
      ],
      onSubmit: v => {
        const data = { t: v.t.trim(), w: v.w.trim(), p: +v.p || 2 };
        if (!data.t) return;
        if (t) Object.assign(t, data);
        else state.tasks.push({ id: uid(), ...data, d: false });
        save();
      },
      onDelete: t ? () => {
        if (!confirm('¿Eliminar esta tarea? No contará en el cierre de semana.')) return;
        tombstone(t.id);
        state.tasks = state.tasks.filter(x => x.id !== t.id);
        save();
      } : null
    });
  }

  function roadmapForm(x) {
    openForm({
      title: x ? 'Editar etapa' : 'Nueva etapa',
      fields: [
        { name: 'm', label: 'Periodo', value: x && x.m, placeholder: 'Meses 1–3' },
        { name: 't', label: 'Qué se logra', type: 'textarea', value: x && x.t, required: true }
      ],
      onSubmit: v => {
        const data = { m: v.m.trim(), t: v.t.trim() };
        if (!data.t) return;
        if (x) Object.assign(x, data);
        else state.roadmap.push({ id: uid(), ...data, d: false });
        save();
      },
      onDelete: x ? () => {
        tombstone(x.id);
        state.roadmap = state.roadmap.filter(r => r.id !== x.id);
        save();
      } : null
    });
  }

  // ---------- acciones ----------
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const id = el.closest('[data-id]') && el.closest('[data-id]').dataset.id;
    lastActId = id;

    switch (el.dataset.act) {
      case 'en-toggle': {
        const k = el.dataset.day;
        if (state.english[k]) { delete state.english[k]; tombstone('en:' + k); }
        else { state.english[k] = 1; delete state.deleted['en:' + k]; }
        save();
        break;
      }
      case 'task-toggle': {
        const t = state.tasks.find(x => x.id === id);
        if (t) { t.d = !t.d; save(); }
        break;
      }
      case 'task-edit': taskForm(state.tasks.find(x => x.id === id)); break;
      case 'task-add': taskForm(null); break;
      case 'close-week': closeWeek(); break;
      case 'inc': state[el.dataset.k] += 1; save(); break;
      case 'dec': if (state[el.dataset.k] > 0) { state[el.dataset.k] -= 1; save(); } break;
      case 'capital-edit':
        openForm({
          title: 'Capital',
          fields: [
            { name: 'capital', label: 'Saldo actual (USD)', type: 'number', value: state.capital },
            { name: 'capital0', label: 'Saldo inicial (USD)', type: 'number', value: state.capital0 }
          ],
          onSubmit: v => {
            state.capital = numOrNull(v.capital);
            state.capital0 = numOrNull(v.capital0);
            if (state.capital0 == null && state.capital != null) state.capital0 = state.capital;
            save();
          }
        });
        break;
      case 'wait-edit': {
        const x = state.waiting.find(w => w.id === id);
        if (!x) break;
        openForm({
          title: 'Pendiente de terceros',
          fields: [
            { name: 't', label: 'Qué esperas y de quién', value: x.t, required: true },
            { name: 'since', label: 'Desde', type: 'date', value: x.since, required: true }
          ],
          onSubmit: v => { x.t = v.t.trim() || x.t; if (isDay(v.since)) x.since = v.since; save(); },
          onDelete: () => { tombstone(x.id); state.waiting = state.waiting.filter(w => w.id !== x.id); save(); },
          deleteLabel: 'Resuelto'
        });
        break;
      }
      case 'wait-done':
        tombstone(id);
        state.waiting = state.waiting.filter(w => w.id !== id);
        save();
        break;
      case 'rm-toggle': {
        const x = state.roadmap.find(r => r.id === id);
        if (x) { x.d = !x.d; save(); }
        break;
      }
      case 'rm-edit': roadmapForm(state.roadmap.find(r => r.id === id)); break;
      case 'rm-add': roadmapForm(null); break;
      case 'export': exportJson(); break;
      case 'import': $('#importFile').click(); break;
    }
  });

  document.addEventListener('submit', e => {
    if (e.target.dataset.form !== 'wait') return;
    e.preventDefault();
    const t = e.target.elements.t.value.trim();
    if (!t) return;
    state.waiting.push({ id: uid(), t, since: dayKey() });
    save();
  });

  let notesTimer;
  $('#notes').addEventListener('input', e => {
    clearTimeout(notesTimer);
    notesTimer = setTimeout(() => { state.notes = e.target.value; save(); }, 600);
  });

  // ---------- copia de seguridad ----------
  function exportJson() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `bitacora-${dayKey()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  $('#importFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const next = normalize(JSON.parse(await file.text()));
      if (!next || !Array.isArray(next.tasks) || next.legacy) throw new Error('formato');
      if (!confirm('Esto reemplaza los datos actuales. ¿Continuar?')) return;
      state = next;
      save();
      toast('Copia importada');
    } catch (err) {
      toast('El archivo no es una copia válida de Bitácora');
    }
  });

  // Refresca "hoy" al volver a la app (p. ej. al día siguiente).
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

  render();
})();
</script>
<script src="/config.js"></script>
<script src="/sync.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
