<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora</title>
<meta name="description" content="Tu historial de trabajo: qué hiciste, en qué avanzas y qué sigue.">
<meta name="theme-color" content="#F6F7F5">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/app/styles.css">
<link rel="modulepreload" href="/app/main.js">
<link rel="modulepreload" href="/app/lib.js">
<link rel="modulepreload" href="/app/db.js">
<link rel="modulepreload" href="/app/store.js">
<link rel="modulepreload" href="/app/model.js">
<link rel="modulepreload" href="/app/ui.js">
<link rel="modulepreload" href="/app/api.js">
<link rel="modulepreload" href="/app/sync.js">
<link rel="modulepreload" href="/app/actions.js">
<link rel="modulepreload" href="/app/capture.js">
<link rel="modulepreload" href="/app/migrate.js">
<link rel="modulepreload" href="/app/views/today.js">
<script src="/config.js"></script>
<script type="module" src="/app/main.js"></script>
</head>
<body>
  <div id="overlay" class="overlay"></div>

  <div id="app" class="app" hidden>
    <aside id="navside" class="navside"></aside>
    <div class="main">
      <div id="chip" class="chip-slot"></div>
      <main id="view" class="view"></main>
    </div>
    <button class="fab" data-act="capture" aria-label="Registrar actividad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <nav id="nav" class="tabbar" aria-label="Secciones"></nav>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><p style="padding:24px;font:16px system-ui">Bitácora necesita JavaScript para funcionar.</p></noscript>
</body>
</html>
